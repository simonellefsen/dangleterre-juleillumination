<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juleillumination · Hotel d'Angleterre</title>
<style>
  :root { --gold: #f3d9a0; --ink: #060a16; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  body { font-family: "Cormorant Garamond", "Hoefler Text", Georgia, serif; color: #fff; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 60%, rgba(3,5,14,.6) 100%),
                linear-gradient(to top, rgba(3,5,14,.7), transparent 24%); }
  #intro { position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
    background: rgba(4,7,18,.66); backdrop-filter: blur(5px); transition: opacity 1.6s ease; padding: 24px; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro h1 { font-weight: 400; font-size: clamp(34px, 6vw, 76px); margin: 0 0 6px; letter-spacing: .04em;
    color: var(--gold); text-shadow: 0 0 34px rgba(255,205,120,.45); }
  #intro p { margin: 4px 0; font-size: clamp(15px, 2vw, 22px); letter-spacing: .12em; opacity: .85; }
  #intro .small { font-size: 13px; letter-spacing: .08em; opacity: .55; margin-top: 18px; }
  button { font: inherit; cursor: pointer; }
  #start { margin-top: 30px; padding: 13px 38px; font-size: 19px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--gold); background: rgba(243,217,160,.07); border: 1px solid rgba(243,217,160,.6); border-radius: 40px;
    transition: background .3s, box-shadow .3s; }
  #start:hover { background: rgba(243,217,160,.18); box-shadow: 0 0 30px rgba(255,205,120,.35); }
  #caption { position: fixed; left: 0; right: 0; bottom: 30px; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 2s ease; text-shadow: 0 2px 14px #000; padding: 0 16px; }
  #caption.on { opacity: 1; }
  #caption .line { font-size: clamp(17px, 2.4vw, 28px); font-style: italic; color: var(--gold); min-height: 1.3em;
    transition: opacity 1s ease; }
  #caption .sub { font-size: 12px; letter-spacing: .28em; text-transform: uppercase; opacity: .6; margin-top: 6px; }
  .corner { position: fixed; top: 16px; opacity: 0; transition: opacity 1s; color: var(--gold); }
  .corner.on { opacity: .8; }
  #mute { right: 16px; width: 42px; height: 42px; border-radius: 50%; font-size: 18px;
    background: rgba(4,7,18,.5); border: 1px solid rgba(243,217,160,.4); }
  #replay { right: 68px; height: 42px; padding: 0 16px; border-radius: 22px; font-size: 13px; letter-spacing: .16em;
    text-transform: uppercase; background: rgba(4,7,18,.5); border: 1px solid rgba(243,217,160,.4); }
  #alt { left: 18px; top: 28px; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>

<div id="caption">
  <div class="line" id="line"></div>
  <div class="sub">Hotel d'Angleterre · Kongens Nytorv · 13. november 2026</div>
</div>
<a class="corner" id="alt" href="photos.html">Fotografierne</a>
<button class="corner" id="replay" title="Forfra">Forfra</button>
<button class="corner" id="mute" title="Lyd til/fra" aria-label="Lyd til/fra">♪</button>

<div id="intro">
  <div>
    <p>Kongens Nytorv · København</p>
    <h1>Juleillumination</h1>
    <p>Hotel d'Angleterre · Københavns Drengekor</p>
    <button id="start">Tænd lysene</button>
    <p class="small" id="musicnote"></p>
  </div>
</div>

<script type="module" src="scene.js"></script>
</body>
</html>
